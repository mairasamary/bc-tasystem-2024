{# Timeslot picker: day-bubble toggles + start/end time inputs #}
<input type="hidden" name="timeslot" id="id_timeslot" value="{{ form.timeslot.value|default:'' }}">

<div class="mt-1">
    <div class="flex flex-wrap gap-1.5 mb-2">
        <button type="button" class="ts-day-btn rounded-full px-3 py-1 text-sm font-medium border-2 transition-colors focus:outline-none" data-day="M">Mon</button>
        <button type="button" class="ts-day-btn rounded-full px-3 py-1 text-sm font-medium border-2 transition-colors focus:outline-none" data-day="Tu">Tue</button>
        <button type="button" class="ts-day-btn rounded-full px-3 py-1 text-sm font-medium border-2 transition-colors focus:outline-none" data-day="W">Wed</button>
        <button type="button" class="ts-day-btn rounded-full px-3 py-1 text-sm font-medium border-2 transition-colors focus:outline-none" data-day="Th">Thu</button>
        <button type="button" class="ts-day-btn rounded-full px-3 py-1 text-sm font-medium border-2 transition-colors focus:outline-none" data-day="F">Fri</button>
    </div>

    <div class="flex items-center gap-2">
        <input type="time" id="ts_start"
            class="rounded-lg border-2 border-gray-300 bg-white p-2 text-sm text-gray-900 focus:ring-bc-maroon focus:border-bc-maroon transition-all">
        <span class="text-gray-500 text-sm font-medium">to</span>
        <input type="time" id="ts_end"
            class="rounded-lg border-2 border-gray-300 bg-white p-2 text-sm text-gray-900 focus:ring-bc-maroon focus:border-bc-maroon transition-all">
    </div>

    <p id="ts_preview" class="text-xs text-gray-400 mt-1.5 min-h-[1rem]"></p>
</div>

<style>
.ts-day-btn { background: white; color: #374151; border-color: #d1d5db; }
.ts-day-btn.ts-active { background: #800000; color: white; border-color: #800000; }
.ts-day-btn:hover:not(.ts-active) { background: #f3f4f6; }
</style>

<script>
(function () {
    const DAY_ORDER = ['M', 'Tu', 'W', 'Th', 'F'];
    const hidden = document.getElementById('id_timeslot');
    const tsStart = document.getElementById('ts_start');
    const tsEnd = document.getElementById('ts_end');
    const preview = document.getElementById('ts_preview');

    function assemble() {
        const days = DAY_ORDER
            .filter(d => document.querySelector('.ts-day-btn[data-day="' + d + '"]')?.classList.contains('ts-active'))
            .join('');
        const start = tsStart.value;
        const end = tsEnd.value;
        let val = days;
        if (start && end) val += (days ? ' ' : '') + start + '-' + end;
        hidden.value = val;
        preview.textContent = val || '';
    }

    document.querySelectorAll('.ts-day-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            btn.classList.toggle('ts-active');
            assemble();
        });
    });
    tsStart.addEventListener('change', assemble);
    tsEnd.addEventListener('change', assemble);

    function parse(val) {
        if (!val) return { days: [], start: '', end: '' };
        const sp = val.indexOf(' ');
        let dayStr = '', timeStr = '';
        if (sp === -1) {
            if (val.includes(':')) timeStr = val;
            else dayStr = val;
        } else {
            dayStr = val.slice(0, sp);
            timeStr = val.slice(sp + 1);
        }
        const days = [];
        let s = dayStr.toUpperCase().replace(/[^A-Z]/g, ''), i = 0;
        while (i < s.length) {
            if (s.slice(i, i + 2) === 'TH') { days.push('Th'); i += 2; }
            else if (s.slice(i, i + 2) === 'TU') { days.push('Tu'); i += 2; }
            else if (s[i] === 'T') { days.push('Tu'); i++; }
            else if ('MWF'.includes(s[i])) { days.push(s[i]); i++; }
            else i++;
        }
        let start = '', end = '';
        if (timeStr.includes('-')) {
            const p = timeStr.split('-');
            start = p[0].trim();
            end = p[1].trim();
        }
        return { days: days, start: start, end: end };
    }

    const parsed = parse(hidden.value);
    parsed.days.forEach(function (d) {
        const btn = document.querySelector('.ts-day-btn[data-day="' + d + '"]');
        if (btn) btn.classList.add('ts-active');
    });
    if (parsed.start) tsStart.value = parsed.start;
    if (parsed.end) tsEnd.value = parsed.end;
    assemble();
})();
</script>
